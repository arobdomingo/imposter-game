services:
  db:
    image: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql #(/data removed) Persists data to a named volume
  web:
    build: .
    entrypoint: ["bash", "scripts/docker-entrypoint.sh"]
    command: ["uvicorn", "user_service.api:app", "--host", "0.0.0.0", "--port", "8000"] # for automatic migration
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db # The service name of your Postgres container
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      AUTH_TTL_SECONDS: 3600
      TESTING: "1"
    develop:
      watch:
        - action: sync+restart
          path: ./
          target: /app/

volumes:
  postgres_data: # Defines the named volume for data persistence
