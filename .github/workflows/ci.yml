name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        
    - name: Install dependencies
      run: |
        uv sync --dev
        
    - name: Run ruff linting
      run: |
        uv run ruff check .
        
    - name: Run ruff format check
      run: |
        uv run ruff format --check .
        
    - name: Set up environment variables
      run: |
        echo "POSTGRES_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "POSTGRES_USER=user" >> $GITHUB_ENV
        echo "POSTGRES_PASSWORD=password" >> $GITHUB_ENV
        echo "POSTGRES_DB=user" >> $GITHUB_ENV
        echo "AUTH_TTL_SECONDS=3600" >> $GITHUB_ENV
        
    - name: Start PostgreSQL service
      run: |
        docker run -d --name postgres-test \
          -e POSTGRES_USER=user \
          -e POSTGRES_PASSWORD=password \
          -e POSTGRES_DB=user \
          -p 5432:5432 \
          postgres:15
        # wait for postgres inside container
        timeout 60 bash -c 'until docker exec postgres-test pg_isready -U user -h 127.0.0.1; do sleep 1; done'
        
    - name: Run database migrations
      run: |
        uv run alembic upgrade head

    - name: Ensure tables exist (safety net)
      run: |
        uv run python - <<'PY'
        from user_service.models.user import Base
        from event_service.models.event import Event  # noqa: F401
        from user_service.models.friendship import Friendship  # noqa: F401
        from shared import database as db
        next(db.get_db())
        Base.metadata.create_all(bind=db.engine)
        print("tables ensured")
        PY
        
    - name: Start application
      run: |
        uv run uvicorn src.user_service.api:app --host 0.0.0.0 --port 8000 &
        # wait events route first (ensures DB interaction path is ready)
        timeout 60 bash -c 'until curl -fsS http://127.0.0.1:8000/v2/events/ > /dev/null; do sleep 1; done'
        
    - name: Wait for analytics health
      run: |
        timeout 60 bash -c 'until curl -fsS http://127.0.0.1:8000/v2/analytics/health > /dev/null; do sleep 1; done'
        
    - name: Run all tests
      run: |
        uv run pytest src/ -v --cov=src --cov-report=xml --cov-report=term-missing
        
    - name: Run specific test suites
      run: |
        echo "Running User Service tests..."
        uv run pytest src/user_service/test_api.py -v
        
        echo "Running Event Service tests..."
        uv run pytest src/event_service/test_events.py -v
        
        echo "Running Analytics API tests..."
        uv run pytest src/analytics/test_analytics_pytest.py -v
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
