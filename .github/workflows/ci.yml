name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        
    - name: Install dependencies
      run: |
        uv sync --dev
        
    - name: Run ruff linting
      run: |
        uv run ruff check .
        
    - name: Run ruff format check
      run: |
        uv run ruff format --check .
        
    - name: Run all tests
      run: |
        uv run pytest src/ -v --cov=src --cov-report=xml --cov-report=term-missing
        
    - name: Run specific test suites
      run: |
        echo "Running User Service tests..."
        uv run pytest src/user_service/test_api.py -v
        
        echo "Running Event Service tests..."
        uv run pytest src/event_service/test_events.py -v
        
        echo "Running Analytics API tests..."
        uv run pytest src/analytics/test_analytics_pytest.py -v
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
