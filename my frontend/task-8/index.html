<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discussion | Imposter Game</title>
  <link rel="stylesheet" href="../shared/reset.css" />
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="../shared/app.js"></script>
</head>
<body>
  <main class="card">
    <header class="header">
      <h1>Clue Submissions</h1>
      <div class="timer"><span id="time">01:00</span></div>
    </header>

    <ul class="list" id="list">
      <!-- Populated via JS -->
    </ul>

    <footer class="footer">
      <p class="hint">Discuss and prepare to vote.</p>
    </footer>
  </main>

  <script>
    const DURATION = 60;
    const timeEl = document.getElementById('time');
    const listEl = document.getElementById('list');

    function render(subs) {
      listEl.innerHTML = '';
      subs.forEach(s => {
        const li = document.createElement('li');
        li.className = 'item' + (s.role === 'imposter' ? ' imposter' : '');
        li.innerHTML = `
          <strong class="user">@${s.user}</strong>
          <span class="text">"${s.text}"</span>
          ${s.role === 'imposter' ? '<span class="badge">Imposter</span>' : ''}
        `;
        listEl.appendChild(li);
      });
    }

    (async () => {
      const subs = await API.getSubmissions(3);
      render(subs);
    })();

    createTimer(DURATION, (t) => {
      timeEl.textContent = fmtTime(t);
    }, () => {
      timeEl.textContent = '00:00';
    });
  </script>
</body>
</html>
