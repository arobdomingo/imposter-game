<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vote | Imposter Game</title>
  <link rel="stylesheet" href="../shared/reset.css" />
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="../shared/app.js"></script>
</head>
<body>
  <main class="card">
    <header class="header">
      <h1>Emergency Meeting</h1>
      <div class="timer"><span id="time">00:30</span></div>
    </header>

    <section class="grid" id="suspects">
      <!-- Populated via JS -->
    </section>

    <footer class="footer">
      <button class="btn btn-skip" id="skipAll">Skip Vote</button>
      <p class="hint">Choose a suspect or skip before the timer ends.</p>
    </footer>
  </main>

  <script>
    const DURATION = 30;
    const suspects = [
      { user: 'BlueJay' },
      { user: 'Scarlet' },
      { user: 'Clover' }
    ];

    const timeEl = document.getElementById('time');
    const gridEl = document.getElementById('suspects');
    const skipAllEl = document.getElementById('skipAll');

    function renderSuspects() {
      gridEl.innerHTML = '';
      suspects.forEach(s => {
        const card = document.createElement('div');
        card.className = 'suspect';
        card.innerHTML = `
          <div class="info">
            <span class="name">@${s.user}</span>
          </div>
          <div class="actions">
            <button class="btn btn-vote" data-user="${s.user}">Vote</button>
            <button class="btn" data-skip="${s.user}">Skip</button>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    renderSuspects();

    gridEl.addEventListener('click', async (e) => {
      const voteBtn = e.target.closest('[data-user]');
      const skipBtn = e.target.closest('[data-skip]');
      if (voteBtn) {
        const target = voteBtn.getAttribute('data-user');
        voteBtn.disabled = true;
        await API.vote({ target });
        voteBtn.textContent = 'Voted';
      } else if (skipBtn) {
        skipBtn.disabled = true;
        skipBtn.textContent = 'Skipped';
      }
    });

    skipAllEl.addEventListener('click', () => {
      document.querySelectorAll('[data-skip]').forEach(b => { b.disabled = true; b.textContent = 'Skipped'; });
    });

    createTimer(DURATION, (t) => {
      timeEl.textContent = fmtTime(t);
    }, () => {
      timeEl.textContent = '00:00';
      document.querySelectorAll('.btn').forEach(b => b.disabled = true);
    });
  </script>
</body>
</html>
