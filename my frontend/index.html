<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Imposter Game MVP</title>
  <link rel="stylesheet" href="shared/reset.css" />
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="styles.css" />
 
 <style>
    body {
      background: var(--bg-clever);
      font-family: sans-serif;
      color: var(--text-default);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .nav {
      max-width: 640px;
      width: 100%;
      padding: 32px;
      background: var(--bg-clue);
      border: 2px solid var(--border-card);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      text-align: center;
    }
    .nav h1 {
      margin-bottom: 24px;
      font-size: 28px;
      color: var(--text-default);
    }
    .nav a {
      display: block;
      padding: 14px;
      margin-bottom: 12px;
      border: 2px solid var(--border-card);
      border-radius: 10px;
      background: #fff;
      font-weight: 600;
      color: var(--text-default);
      transition: all 0.25s ease;
    }
    .nav a:hover {
      background: var(--bg-clever);
      color: var(--text-default);
      transform: scale(1.03);
    }
    .nav a:active {
      background: var(--btn-disabled-bg);
      color: var(--btn-disabled-text);
    }
  </style>
</head>
<body>
  <main class="nav">
    <h1>Imposter MVP Pages</h1>
    <a href="task-2/index.html">Task 2: Authentication</a>
    <a href="task-6/index.html">Task 6: Submission & Voting</a>
    <a href="task-8/index.html">Task 8: Clue Revelation & Discussion</a>
    <a href="task-9/index.html">Task 9: Meeting & Voting</a>
  </main>
</body>
</html>
