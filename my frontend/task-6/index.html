<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Round Submission | Imposter Game</title>
  <link rel="stylesheet" href="../shared/reset.css" />
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="../shared/app.js"></script>
</head>
<body>
  <main class="card">
    <header class="header">
      <h1>Round <span id="roundNum">3</span></h1>
      <div class="timer"><span id="time">00:45</span></div>
    </header>

    <section class="content">
      <p class="hint">Submit your clue before the timer runs out.</p>
      <input type="text" id="clueInput" placeholder="Enter your clue..." />
      <div class="actions">
        <button class="btn btn-primary" id="submitBtn">Submit</button>
        <button class="btn" id="skipBtn">Skip</button>
      </div>
      <p class="status" id="status"></p>
    </section>
  </main>

  <script>
    const ROUND = 3;
    const DURATION = 45;

    const timeEl = document.getElementById('time');
    const inputEl = document.getElementById('clueInput');
    const submitEl = document.getElementById('submitBtn');
    const skipEl = document.getElementById('skipBtn');
    const statusEl = document.getElementById('status');
    document.getElementById('roundNum').textContent = ROUND;

    let stopTimer = createTimer(DURATION, (t) => {
      timeEl.textContent = fmtTime(t);
    }, () => {
      inputEl.disabled = true;
      submitEl.disabled = true;
      statusEl.textContent = 'Time is up. Waiting for others...';
      statusEl.classList.add('muted');
    });

    submitEl.addEventListener('click', async () => {
      const text = inputEl.value.trim();
      if (!text) return;
      submitEl.disabled = true;
      statusEl.textContent = 'Submitting...';
      await API.submitClue({ round: ROUND, text });
      statusEl.textContent = 'Clue submitted!';
    });

    skipEl.addEventListener('click', () => {
      inputEl.value = '';
      statusEl.textContent = 'Skipped this round.';
      submitEl.disabled = true;
    });
  </script>
</body>
</html>
