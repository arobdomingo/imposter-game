<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voting Results</title>
  <link rel="stylesheet" href="../css/style.css?v=2.1">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eef2f3, #e8faff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .page-container {
      background: #ffffff;
      border-radius: 22px;
      padding: 32px 40px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.18);
      text-align: center;
      max-width: 500px;
      width: 90%;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #333;
    }

    .results {
      list-style: none;
      padding: 0;
      margin-bottom: 20px;
    }

    .results li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 12px;
      margin: 6px 0;
      background: #f4fbff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      font-weight: 600;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .results li:hover {
      transform: scale(1.02);
      background: #e0f0ff;
    }

    .name {
      color: #4b7bec;
    }

    .votes {
      font-weight: 700;
      color: #222;
    }

    .quirky-line {
      margin: 12px 0;
      font-style: italic;
      font-weight: 500;
      color: #222;
    }

    .reveal {
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      background: #fff6d3;
      border: 2px solid #ffe08a;
      box-shadow: 0 4px 10px rgba(255,200,0,0.25);
      animation: popIn 0.5s ease forwards;
    }

    .reveal p {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      color: #333;
    }

    .reveal h2 {
      font-size: 32px;
      margin-top: 8px;
      color: #d93a3a;
      font-weight: 800;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .view-scores-btn {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background-color: #4b7bec;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .view-scores-btn:hover {
      transform: scale(1.05);
      background-color: #3867d6;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <h1>The Accusation Board 🧩</h1>

    <ul class="results" id="resultsList">
      <!-- JS will populate votes -->
    </ul>

    <!-- Quirky congratulatory line -->
    <p class="quirky-line">🕵️‍♀️ Sharp minds at work! Who’s the sneaky imposter? 🕵️‍♂️</p>

    <div class="reveal">
      <p>The imposter was…</p>
      <h2 class="imposter" id="realImposter">@???</h2>
    </div>

    <!-- View Scores Button -->
    <button class="view-scores-btn" onclick="window.location.href='leaderboard.html'">
      View Scores
    </button>
  </div>

  <script>
    // Example data from vote round
    const votes = [
      { voter: 'John', votedFor: 'Alice' },
      { voter: 'Alice', votedFor: 'Sara' },
      { voter: 'Sara', votedFor: 'John' },
      { voter: 'Mike', votedFor: 'Alice' }
    ];

    const realImposter = 'Sara'; // Replace with actual imposter

    const players = ['John', 'Alice', 'Sara', 'Mike'];
    const resultsEl = document.getElementById('resultsList');
    const imposterEl = document.getElementById('realImposter');

    // Count votes per player
    const voteCount = {};
    players.forEach(p => voteCount[p] = 0);
    votes.forEach(v => voteCount[v.votedFor]++);

    // Show each player's vote
    votes.forEach(v => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="name">@${v.voter}</span> voted for <span class="votes">@${v.votedFor}</span>`;
      resultsEl.appendChild(li);
    });

    // Show total votes
    const totalsHeader = document.createElement('li');
    totalsHeader.style.fontWeight = '700';
    totalsHeader.style.marginTop = '10px';
    totalsHeader.style.borderTop = '2px solid #ddd';
    totalsHeader.style.paddingTop = '10px';
    totalsHeader.textContent = 'Total Votes:';
    resultsEl.appendChild(totalsHeader);

    players.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="name">@${p}</span><span class="votes">${voteCount[p]} votes</span>`;
      resultsEl.appendChild(li);
    });

    // Reveal real imposter
    imposterEl.textContent = `@${realImposter}`;
  </script>
</body>
</html>
